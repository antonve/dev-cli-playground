apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-router
  namespace: dev-cli-playground
  labels:
    app.kubernetes.io/name: dev-router
    app.kubernetes.io/part-of: dev-cli-playground
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dev-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dev-router
        app.kubernetes.io/part-of: dev-cli-playground
        app.kubernetes.io/managed-by: argocd
    spec:
      containers:
        - name: router
          image: registry.dev.lab/dev-cli-playground/dev-router@sha256:8e94340b6458e6e3b011ada6386436903a97f9f961a8294476564bb9b79a6248
          imagePullPolicy: IfNotPresent
          env:
            - name: DEV_NAMESPACE
              value: dev-cli-playground
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /__dev/current
              port: http
            periodSeconds: 2
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 500m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata:
  name: dev-router
  namespace: dev-cli-playground
  labels:
    app.kubernetes.io/name: dev-router
    app.kubernetes.io/part-of: dev-cli-playground
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    app.kubernetes.io/name: dev-router
  ports:
    - name: http
      port: 80
      targetPort: http
---
