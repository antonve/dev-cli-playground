apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web
  namespace: dev-cli-playground
  labels: &web-labels
    app.kubernetes.io/name: hello-web
    app.kubernetes.io/part-of: dev-cli-playground
    app.kubernetes.io/managed-by: argocd
    dev-cli.io/service: hello-web
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: hello-web}
  template:
    metadata: {labels: *web-labels}
    spec:
      containers:
        - name: app
          image: hello-web:latest
          imagePullPolicy: Always
          env:
            - {name: DEV_BRANCH, value: base}
            - {name: DEV_REVISION, value: main}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 2}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities: {drop: [ALL]}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
---
apiVersion: v1
kind: Service
metadata:
  name: hello-web
  namespace: dev-cli-playground
  labels:
    app.kubernetes.io/name: hello-web
    app.kubernetes.io/part-of: dev-cli-playground
    app.kubernetes.io/managed-by: argocd
    dev-cli.io/service: hello-web
spec:
  selector: {app.kubernetes.io/name: hello-web}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-api
  namespace: dev-cli-playground
  labels: &hello-labels
    app.kubernetes.io/name: hello-api
    app.kubernetes.io/part-of: dev-cli-playground
    app.kubernetes.io/managed-by: argocd
    dev-cli.io/service: hello-api
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: hello-api}
  template:
    metadata: {labels: *hello-labels}
    spec:
      containers:
        - name: app
          image: hello-api:latest
          imagePullPolicy: Always
          env:
            - {name: DEV_BRANCH, value: base}
            - {name: DEV_REVISION, value: main}
            - {name: DEV_NAMESPACE, value: dev-cli-playground}
            - {name: DEV_INTERNAL_GATEWAY, value: http://dev-cli-gateway}
          ports: [{name: http, containerPort: 8081}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 2}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 500m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities: {drop: [ALL]}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
---
apiVersion: v1
kind: Service
metadata:
  name: hello-api
  namespace: dev-cli-playground
  labels:
    app.kubernetes.io/name: hello-api
    app.kubernetes.io/part-of: dev-cli-playground
    app.kubernetes.io/managed-by: argocd
    dev-cli.io/service: hello-api
spec:
  selector: {app.kubernetes.io/name: hello-api}
  ports: [{name: http, port: 8081, targetPort: http}]
---
