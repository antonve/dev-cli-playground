apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-cli-playground
  namespace: dev-cli-playground
  annotations:
    cert-manager.io/cluster-issuer: lab-ca-acme
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [dev-cli-playground.dev.lab]
      secretName: dev-cli-playground-tls
  rules:
    - host: dev-cli-playground.dev.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dev-router
                port:
                  name: http
