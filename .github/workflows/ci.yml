name: build-and-publish

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-cli-playground-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test frontend
        run: pnpm test && pnpm typecheck && pnpm build
      - name: Test and build Bazel graph
        run: |
          bazel test //... --noshow_progress
          bazel build //apps/hello-web:image //apps/hello-api:image //apps/echo-api:image --noshow_progress
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish main images
        if: github.event_name == 'push'
        env:
          REVISION: ${{ github.sha }}
        run: |
          for service in hello-web hello-api echo-api; do
            bazel run "//apps/${service}:image_push" --noshow_progress -- --repository "ghcr.io/antonve/dev-cli-playground/${service}" --tag latest
            bazel run "//apps/${service}:image_push" --noshow_progress -- --repository "ghcr.io/antonve/dev-cli-playground/${service}" --tag "sha-${REVISION}"
          done
